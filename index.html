<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IE211 - Professional Exam Scheduler Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vis.js for Network Graph -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'Inter', 'sans-serif'],
                        mono: ['Inter', 'monospace'],
                    },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .vis-network:focus { outline: none; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-500 rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-project-diagram text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-wide">IE211 Exam Scheduler</h1>
                    <p class="text-[11px] text-slate-400 font-mono">Graph Coloring & Set Theory Implementation</p>
                </div>
            </div>
            <div class="flex gap-2">
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
                    <label class="text-xs text-slate-400 font-medium">Algorithm:</label>
                    <select id="algo-select" onchange="runEngine()" class="bg-transparent text-sm font-semibold text-white outline-none cursor-pointer">
                        <option value="welsh-powell" class="text-slate-900">Welsh-Powell</option>
                        <option value="dsatur" class="text-slate-900">DSATUR</option>
                    </select>
                </div>
                <button onclick="loadSlideData()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-chalkboard-user"></i> Load Slide Data
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- LEFT: Data Input -->
        <div class="lg:col-span-4 flex flex-col gap-5">
            
            <!-- Date & Slot Configuration (เพิ่มใหม่) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200">
                    <h2 class="font-bold text-slate-800 text-sm"><i class="fa-regular fa-calendar-days text-brand-600 mr-2"></i>ตั้งค่าวันและรอบสอบ (Exam Dates)</h2>
                </div>
                <div class="p-4 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">วันเริ่มสอบวันแรก</label>
                            <input type="date" id="in-start-date" onchange="renderSchedule()" class="w-full px-2.5 py-1.5 text-sm border rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">จำนวนรอบสอบต่อวัน</label>
                            <select id="in-slots-per-day" onchange="renderSchedule()" class="w-full px-2.5 py-1.5 text-sm border rounded-lg focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                                <option value="1">1 รอบ/วัน (เช้า)</option>
                                <option value="2" selected>2 รอบ/วัน (เช้า / บ่าย)</option>
                                <option value="3">3 รอบ/วัน (เช้า / บ่าย / ค่ำ)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="in-skip-weekend" onchange="renderSchedule()" class="
